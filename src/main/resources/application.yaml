spring:
  application:
    name: card-service

  datasource:
    url: ${DB_URL_CARD}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true                                                                                                                                                   
  autoconfigure:
      exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

# ============================================================
# JWT
# ============================================================

jwt:
  secret: ${JWT_SECRET}
  expiration: ${EXPIRATION}
